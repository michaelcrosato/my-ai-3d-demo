const LOOKS = [{"schema":"stylelab.look@1","version":1,"tags":["toon","bright","outdoor","phone-safe"],"pillars":["Two hard light tones, never gradients.","Shadows are blue-violet, never gray.","Saturated, simple colors.","A big bright sky.","Lines only on characters."],"mistakes":["Black outlines on terrain.","Gray shadows.","Soft gradients in the shading."],"parts":{"characters":{"params":{"lines.hull.enabled":true,"lines.hull.thickness":1.6,"lines.hull.color":"#20243f","surface.spec.intensity":0.6,"surface.spec.size":0.08,"surface.spec.softness":0.01}},"water":{"params":{"surface.model":"toonWater","surface.water.deep":"#1c6fd1","surface.water.shallow":"#45c3e0","surface.water.foam":0.35}}},"id":"sea-breeze","name":"Sea Breeze Toon","inspiredBy":["The Legend of Zelda: The Wind Waker"],"phone":"cheap","description":"Sunny, playful cel-shaded adventure: two hard tones, blue-violet shadows, banded toon water and a big bright sky with toon clouds.","bestScenes":["harbor","lookdev"],"params":{"lighting.key.elevation":55,"lighting.key.color":"#fff2d6","lighting.key.intensity":3.2,"lighting.ambient.sky":"#8cc8ff","lighting.ambient.ground":"#7fa36b","lighting.ambient.intensity":0.55,"lighting.shadows.softness":0.3,"surface.model":"toon","surface.bands":2,"surface.threshold":0.45,"surface.softness":0.02,"surface.shadowTint":"#5866d0","surface.shadowTintStrength":0.55,"palette.saturation":1.25,"palette.value":1.05,"atmosphere.fog.type":"exp2","atmosphere.fog.density":0.006,"atmosphere.fog.skyTint":1,"atmosphere.fog.bands":3,"atmosphere.sky.zenith":"#2d88e8","atmosphere.sky.horizon":"#bdebff","atmosphere.sky.ground":"#bdebff","atmosphere.sky.exponent":0.8,"atmosphere.sky.sunSize":3,"atmosphere.sky.sunSoftness":0.6,"atmosphere.clouds.amount":0.35,"lens.bloom.enabled":true,"lens.bloom.strength":0.3,"lens.bloom.radius":0.4,"lens.bloom.threshold":0.9,"lens.vignette.amount":0.08,"grade.toneMapping":"neutral","grade.contrast":1.05}},{"schema":"stylelab.look@1","version":1,"tags": raphy"],"phone":"medium","description":"A low, warm backlight with long shadows, a violet fill, warm haze, god rays and glow.","bestScenes":["harbor","lookdev"],"params":{"lighting.key.elevation":8,"lighting.key.azimuth":150,"lighting.key.color":"#ffb066","lighting.key.intensity":4,"lighting.ambient.sky":"#6e7fd6","lighting.ambient.ground":"#8b5b3c","lighting.ambient.intensity":0.6,"lighting.shadows.softness":2,"surface.model":"pbr","surface.rim.color":"#ffc27a","surface.rim.width":0.35,"surface.rim.intensity":0.6,"surface.rim.litSide":true,"atmosphere.fog.type":"exp","atmosphere.fog.density":0.005,"atmosphere.fog.amount":0.85,"atmosphere.fog.skyTint":1,"atmosphere.heightFog.density":0.015,"atmosphere.godRays.enabled":true,"atmosphere.godRays.intensity":0.5,"atmosphere.sky.zenith":"#3b4c99","atmosphere.sky.horizon":"#ff9d5c","atmosphere.sky.ground":"#ff9d5c","atmosphere.sky.exponent":0.6,"atmosphere.sky.sunSize":6,"atmosphere.sky.sunSoftness":0.8,"atmosphere.sky.sunIntensity":8,"lens.bloom.enabled":true,"lens.bloom.threshold":0.85,"lens.bloom.strength":0.35,"lens.bloom.radius":0.6,"lens.vignette.amount":0.2,"grade.toneMapping":"agx","grade.exposure":0,"grade.temperature":0.2,"grade.saturation":1.1,"grade.split.amount":0.35,"grade.split.shadows":"#4b4fa3","grade.split.highlights":"#ffb46b","grade.split.balance":0.1}},{"schema":"stylelab.look@1","version":1,"tags":["toon","phone-safe"],"pillars":["One scene pass, no extra buffers.","All styling in the materials.","Cheap color work fused into one final pass."],"mistakes":["Adding bloom or screen-space lines: each adds full-screen passes.","Lines on terrain."],"parts":{"terrain":{"params":{"lines.hull.enabled":false}},"water":{"params":{"lines.hull.enabled":false}},"sky":{"params":{"lines.hull.enabled":false}},"characters":{"params":{"lighting.blob.enabled":true}}},"id":"phone-safe-toon","name":"Phone-Safe Toon","inspiredBy":["Reference mobile look"],"phone":"cheap","description":"Everything a phone GPU likes: cel shading, hull lines, blob shadows and fog inside the materials, plus one cheap fused final pass. No bloom, no extra buffers.","bestScenes":["harbor","lookdev"],"params":{"lighting.shadows.softness":0.5,"lighting.shadows.mapSize":1024,"surface.model":"toon","surface.bands":2,"surface.softness":0.03,"surface.shadowTint":"#5b63c9","surface.shadowTintStrength":0.5,"surface.rim.intensity":0.3,"lines.hull.enabled":true,"lines.hull.thickness":1.5,"atmosphere.fog.type":"exp2","atmosphere.fog.density":0.008,"atmosphere.fog.skyTint":1,"lens.vignette.amount":0.12,"grade.toneMapping":"neutral","grade.saturation":1.1,"grade.contrast":1.05}}];

const params = new URLSearchParams( location.search );
const canvas = document.getElementById( 'view' );
const renderer = new THREE.WebGPURenderer( { canvas, antialias: false, forceWebGL: params.get( 'backend' ) === 'webgl' } );
renderer.setPixelRatio( Math.min( 2, devicePixelRatio ) );
await renderer.init();

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera( 50, 1, 0.1, 600 );
const controls = new OrbitControls( camera, canvas );
controls.enableDamping = true;

let animate = () => {}, player = null, sceneParams = {}, frame = null;
const tier = Number( params.get( 'tier' ) ?? 1 );

if ( params.get( 'scene' ) ) {

	// One of the kit's example scenes, framed like Style Lab's shot (parity checks use this).
	const def = KIT.sceneById.get( params.get( 'scene' ) );
	const built = KIT.buildScene( def, { tier } );
	scene.add( built.root );
	animate = built.animate;
	sceneParams = def.params;
	frame = def;
	const shot = def.shots[ params.get( 'shot' ) || def.defaultShot ];
	camera.position.set( ...shot.pos );
	camera.fov = shot.fov;
	camera.far = def.far;
	controls.target.set( ...shot.target );

} else {

	// The scaffold: a ground, a few kit props, and a capsule you can move.
	const rng = KIT.createRng( 7 );
	const ground = KIT.mesh( new THREE.CircleGeometry( 24, 48 ).rotateX( - Math.PI / 2 ), { part: 'terrain', color: '#8fbf5a', castShadow: false } );
	scene.add( ground );
	scene.add( KIT.at( KIT.house( tier, { wall: '#f2e6d0', roof: '#c0392b', trim: '#ffffff', door: '#6d4c41' } ), [ - 5, 0, - 5 ], [ 0, 0.4, 0 ] ) );
	for ( const [ x, z ] of [ [ 6, - 4 ], [ - 8, 3 ], [ 4, 7 ] ] ) scene.add( KIT.at( KIT.tree( tier, rng.fork() ), [ x, 0, z ] ) );
	for ( const [ x, z ] of [ [ 2, - 2 ], [ 2.9, - 2.2 ] ] ) scene.add( KIT.at( KIT.crate( tier ), [ x, 0, z ], [ 0, rng() * 2, 0 ] ) );
	scene.add( KIT.at( KIT.character( tier, { part: 'characters', shirt: '#8e44ad' } ), [ - 2, 0, 3 ], [ 0, 1, 0 ] ) );
	player = KIT.mesh( new THREE.CapsuleGeometry( 0.35, 1, 4, 12 ), { part: 'hero', color: '#e8554e' } );
	player.position.set( 0, 0.85, 0 );
	scene.add( player );
	camera.position.set( 8, 7, 11 );
	controls.target.set( 0, 1, 0 );

}

const style = await createStyle( { renderer, scene, camera, looks: LOOKS, sceneParams, frame } );
if ( params.get( 'look' ) && LOOKS.some( ( l ) => l.id === params.get( 'look' ) ) ) style.setLook( params.get( 'look' ), { transition: 'cut' } );
style.focus.copy( controls.target );

const select = document.getElementById( 'look' );
select.innerHTML = LOOKS.map( ( l ) => `<option value="${l.id}">${l.name}</option>` ).join( '' );
select.value = style.current;
select.addEventListener( 'change', () => style.setLook( select.value ) );

const keys = new Set();
addEventListener( 'keydown', ( e ) => {

	keys.add( e.key.toLowerCase() );
	const n = Number( e.key );
	if ( n >= 1 && n <= LOOKS.length ) { style.setLook( LOOKS[ n - 1 ].id ); select.value = LOOKS[ n - 1 ].id; }

} );
addEventListener( 'keyup', ( e ) => keys.delete( e.key.toLowerCase() ) );

function resize() {

	renderer.setSize( innerWidth, innerHeight, false );
	camera.aspect = innerWidth / innerHeight;
	camera.updateProjectionMatrix();

}

addEventListener( 'resize', resize );
resize();

const clock = new THREE.Timer();
let frozen = null;
function update( dt ) {

	if ( player ) {

		const fwd = new THREE.Vector3().subVectors( controls.target, camera.position ).setY( 0 ).normalize();
		const right = new THREE.Vector3( - fwd.z, 0, fwd.x );
		const move = new THREE.Vector3();
		if ( keys.has( 'w' ) || keys.has( 'arrowup' ) ) move.add( fwd );
		if ( keys.has( 's' ) || keys.has( 'arrowdown' ) ) move.sub( fwd );
		if ( keys.has( 'd' ) || keys.has( 'arrowright' ) ) move.add( right );
		if ( keys.has( 'a' ) || keys.has( 'arrowleft' ) ) move.sub( right );
		if ( move.lengthSq() ) {

			move.normalize().multiplyScalar( 4 * dt );
			player.position.add( move );
			camera.position.add( move );
			controls.target.add( move );

		}

		style.focus.copy( player.position );

	}

	controls.update();
	animate( frozen ?? style.time );

}

renderer.setAnimationLoop( () => {

	clock.update();
	const dt = Math.min( 0.1, clock.getDelta() );
	update( dt );
	style.render( frozen === null ? dt : 0 );

} );

// Test hook: render a w × h frame at a frozen time and return its pixels (parity checks).
window.__starter = {
	style,
	async capture( { width = 480, height = 270, time = 1 } = {} ) {

		renderer.setAnimationLoop( null );
		frozen = time;
		style.time = time;
		const ratio = renderer.getPixelRatio(), size = renderer.getSize( new THREE.Vector2() );
		renderer.setPixelRatio( 1 );
		renderer.setSize( width, height, false );
		camera.aspect = width / height;
		camera.updateProjectionMatrix();
		const rt = new THREE.RenderTarget( width, height, { depthBuffer: true } );
		const grab = async () => {

			animate( time );
			renderer.setRenderTarget( rt );
			style.render( 0 );
			renderer.setRenderTarget( null );
			return renderer.readRenderTargetPixelsAsync( rt, 0, 0, width, height );

		};

		await grab(); // compile
		const raw = await grab();
		rt.dispose();
		renderer.setPixelRatio( ratio );
		renderer.setSize( size.x, size.y, false );

		// Tightly packed, top-down RGBA rows (WebGPU pads rows to 256 bytes; WebGL reads bottom-up).
		const bytes = new Uint8Array( raw.buffer, raw.byteOffset, raw.byteLength );
		const stride = bytes.length === width * height * 4 ? width * 4 : Math.ceil( width * 4 / 256 ) * 256;
		const out = new Uint8Array( width * height * 4 );
		const flip = ! renderer.backend.isWebGPUBackend;
		for ( let y = 0; y < height; y ++ ) out.set( bytes.subarray( ( flip ? height - 1 - y : y ) * stride, ( flip ? height - 1 - y : y ) * stride + width * 4 ), y * width * 4 );
		return Array.from( out );

	},
};
