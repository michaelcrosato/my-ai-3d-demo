<html lang="en">
<head>

	<title>Style Lab</title>
	<style>
/* Neutral-gray UI so the chrome doesn't bias color judgment (design §5.1). */
:root {
	--bg: #1b1b1c;
	--panel: #242426;
	--panel-2: #2d2d30;
	--line: #3a3a3e;
	--text: #e6e6e6;
	--muted: #9a9a9f;
	--accent: #8ab4f8;
	--ok: #7cc47f;
	--bad: #e5786d;
	--warn: #e2c06b;
	color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
button { font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
button:hover { border-color: var(--muted); }
button:disabled { opacity: 0.5; cursor: default; }
button.primary { border-color: var(--accent); color: var(--accent); }
code, pre { font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }

#app { display: grid; grid-template-rows: auto 1fr auto; height: 100%; }

.topbar { display: flex; align-items: center; gap: 10px; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { font-weight: 650; letter-spacing: 0.2px; }
.milestone, .build { color: var(--muted); }
.spacer { flex: 1; }
.badge { padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.badge.gpu { color: var(--ok); border-color: var(--ok); }
.badge.gl { color: var(--warn); border-color: var(--warn); }
#verify-btn.has-errors { border-color: var(--bad); color: var(--bad); }

.viewport { position: relative; min-height: 0; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#fatal { position: absolute; inset: 24px; padding: 16px; background: var(--panel); border: 1px solid var(--bad); border-radius: 8px; color: var(--bad); }

.statusbar { padding: 4px 16px; background: var(--panel); border-top: 1px solid var(--line); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; z-index: 10; box-shadow: -8px 0 24px rgb(0 0 0 / 0.35); }
.drawer[hidden] { display: none; }
.drawer header { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.drawer header .close { margin-left: auto; }
.drawer nav { display: flex; gap: 4px; padding: 8px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.drawer nav button.on { border-color: var(--accent); color: var(--accent); }
.drawer .count { color: var(--bad); }
.drawer .body { overflow: auto; padding: 12px 16px 24px; }
.hint { color: var(--muted); }
.row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 6px 0; }

.check { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; margin: 10px 0; background: var(--panel-2); }
.check h4 { margin: 2px 0 4px; font-size: 13px; }
.check ol { margin: 4px 0; padding-left: 20px; }
.check .expected { margin: 4px 0; color: var(--muted); }
.cid { color: var(--muted); font-weight: 500; margin-right: 4px; }
.check textarea, textarea.report { width: 100%; min-height: 44px; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px; font: inherit; }
textarea.report { min-height: 340px; font: 12px/1.4 ui-monospace, monospace; }
button.status.on.pass { border-color: var(--ok); color: var(--ok); }
button.status.on.fail { border-color: var(--bad); color: var(--bad); }
button.status.on.unsure { border-color: var(--warn); color: var(--warn); }

.spike { border: 1px solid var(--line); border-radius: 8px; margin: 8px 0; padding: 6px 10px; background: var(--panel-2); }
.spike summary { cursor: pointer; }
.spike table { width: 100%; border-collapse: collapse; margin: 6px 0; }
.spike td { padding: 2px 4px; border-top: 1px solid var(--line); vertical-align: top; }
.spike tr.bad td { color: var(--bad); }
.spike tr.info td { color: var(--muted); }
.chip { display: inline-block; min-width: 76px; text-align: center; padding: 0 6px; border-radius: 999px; border: 1px solid currentColor; font-size: 11px; }
.chip.go { color: var(--ok); }
.chip.go-fallback { color: var(--warn); }
.chip.no-go, .chip.error { color: var(--bad); }
.ms { color: var(--muted); float: right; }
pre.err, pre.warn { white-space: pre-wrap; word-break: break-word; padding: 6px 8px; border-radius: 6px; background: var(--bg); margin: 4px 0; }
pre.err { color: var(--bad); }
pre.warn { color: var(--warn); }
table.env td { padding: 2px 6px; vertical-align: top; border-bottom: 1px solid var(--line); }
table.env td:first-child { color: var(--muted); white-space: nowrap; }
table.env code { word-break: break-all; }

@media (max-width: 700px) {
	.milestone, .build { display: none; }
	.topbar { padding: 8px 12px; }
}
</style>

    lines.push(`Warnings (${warnings.length}):`);

  controls.enableDamping = true;
  controls.update();
  const post = new THREE11.PostProcessing(renderer);
  post.outputNode = pass6(stage.scene, camera);
  const resize = () => {
    const { clientWidth: w, clientHeight: h } = canvas.parentElement;
    renderer.setSize(w, h, false);
    camera.aspect = w / Math.max(1, h);
    camera.updateProjectionMatrix();
  };
  new ResizeObserver(resize).observe(canvas.parentElement);
  resize();
  const stats = { fps: 0, cpuMs: 0, gpuMs: null, method: timestampsSupported(renderer) ? "timestamp" : "n/a", triangles: 0, calls: 0 };
  const timer = new THREE11.Timer();
  let paused = false, resolving = false, frames = 0, last = performance.now();
  const render = () => post.render();
  renderer.setAnimationLoop(() => {
    if (paused) return;
    timer.update();
    controls.update();
    stage.animate(timer.getElapsed());
    const t0 = performance.now();
    renderer.info.reset();
    render();
    stats.cpuMs += (performance.now() - t0 - stats.cpuMs) * 0.1;
    stats.triangles = renderer.info.render.triangles;
    stats.calls = renderer.info.render.drawCalls;
    if (stats.method === "timestamp" && !resolving) {
      resolving = true;
      renderer.resolveTimestampsAsync("render").then((ms) => {
        if (ms > 0) stats.gpuMs = stats.gpuMs === null ? ms : stats.gpuMs + (ms - stats.gpuMs) * 0.1;
        resolving = false;
      });
    }
    frames++;
    const now = performance.now();
    if (now - last > 500) {
      stats.fps = frames * 1e3 / (now - last);
      frames = 0;
      last = now;
      $("status").textContent = [
        api.backend,
        `${Math.round(stats.fps)} fps`,
        `CPU ${stats.cpuMs.toFixed(2)} ms`,
        `GPU ${stats.gpuMs === null ? "n/a" : stats.gpuMs.toFixed(2) + " ms"}`,
        `${(stats.triangles / 1e3).toFixed(1)}k tris`,
        `${stats.calls} calls`,
        `DPR ${renderer.getPixelRatio()}`
      ].join(" · ");
    }
  });
  const runSpikes2 = async (ids = null, onResult, options) => {
    paused = true;
    try {
      while (resolving) await new Promise((r) => setTimeout(r, 5));
      return await runSpikes({ renderer, ids, onResult, options });
    } finally {
      paused = false;
    }
  };
  const viewport = () => ({ width: renderer.domElement.width, height: renderer.domElement.height });
  const panel = createVerifyPanel({
    root: $("verify"),
    build: BUILD,
    getEnv: () => ({ ...api.caps, viewport: viewport() }),
    log,
    getPerf: () => ({ ...stats }),
    runSpikes: (onResult) => runSpikes2(null, onResult)
  });
  const verifyButton = $("verify-btn");
  verifyButton.addEventListener("click", () => panel.toggle());
  const updateCount = () => {
    const n = log.errors().length;
    verifyButton.textContent = n ? `🧪 Verify · ${n} error${n > 1 ? "s" : ""}` : "🧪 Verify";
    verifyButton.classList.toggle("has-errors", n > 0);
  };
  log.onChange(updateCount);
  updateCount();
  Object.assign(api, {
    renderer,
    frameStats: () => ({ ...stats }),
    /** Renders the current view offscreen and returns luma statistics. */
    capture: async ({ width = 512, height = 288 } = {}) => {
      paused = true;
      try {
        return pixelStats(await renderToPixels(renderer, width, height, render));
      } finally {
        paused = false;
      }
    },
    /** Runs spikes and returns their results; `ids` defaults to all. */
    runSpikes: async (ids = null, options = {}) => {
      const results = await runSpikes2(ids, () => {
      }, options);
      if (!ids) panel.setSpikes(results);
      return results;
    },
    report: () => panel.report()
  });
  await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
  markReady(true);
  if (params.spikes) {
    panel.toggle(true);
    await panel.startSpikes();
  }
}
</script>
</body>
</html>
