<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Style Lab</title>
	<style>
/* Neutral-gray UI so the chrome doesn't bias color judgment (design §5.1). */
:root {
	--bg: #1b1b1c;
	--panel: #242426;
	--panel-2: #2d2d30;
	--line: #3a3a3e;
	--text: #e6e6e6;
	--muted: #9a9a9f;
	--accent: #8ab4f8;
	--ok: #7cc47f;
	--bad: #e5786d;
	--warn: #e2c06b;
	color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
button { font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
button:hover { border-color: var(--muted); }
button:disabled { opacity: 0.5; cursor: default; }
button.primary { border-color: var(--accent); color: var(--accent); }
code, pre { font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }

#app { display: grid; grid-template-rows: auto 1fr auto; height: 100%; }

.topbar { display: flex; align-items: center; gap: 10px; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { font-weight: 650; letter-spacing: 0.2px; }
.build { color: var(--muted); }
.spacer { flex: 1; }
.badge { padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.badge.gpu { color: var(--ok); border-color: var(--ok); }
.badge.gl { color: var(--warn); border-color: var(--warn); }
#verify-btn.has-errors { border-color: var(--bad); color: var(--bad); }

button.on { border-color: var(--accent); color: var(--accent); }
kbd { font: 11px ui-monospace, monospace; padding: 0 4px; border: 1px solid var(--line); border-radius: 4px; color: var(--muted); }
select, input[type="range"] { accent-color: var(--accent); }
select { font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
.field { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
.field.tier input { width: 110px; }
#tier-label { color: var(--text); min-width: 64px; }
.narrow-only { display: none; }

.workspace { display: grid; grid-template-columns: 230px minmax(0, 1fr) 360px; min-height: 0; }
.looks, .inspector { background: var(--panel); overflow: auto; min-height: 0; }
.looks { border-right: 1px solid var(--line); padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.looks h3 { margin: 2px 0 2px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); }
.look-card { display: grid; grid-template-columns: 1fr auto; text-align: left; padding: 8px 10px; gap: 2px 8px; background: var(--panel-2); }
.look-card .swatches { grid-column: 1 / -1; display: flex; gap: 3px; }
.look-card .swatches i { width: 18px; height: 10px; border-radius: 3px; border: 1px solid rgb(255 255 255 / 0.12); }
.look-card .name { font-weight: 600; }
.look-card .insp, .look-card .tags { grid-column: 1; color: var(--muted); font-size: 11.5px; }
.look-card .key { grid-column: 2; grid-row: 2; align-self: center; }
.look-card.on { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }

.inspector { border-left: 1px solid var(--line); display: flex; flex-direction: column; }
.inspector .tabs { display: flex; gap: 4px; padding: 8px 10px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 1; }
.inspector .tabs button.on { border-color: var(--accent); color: var(--accent); }
.tab-pane { padding: 10px; }
.tab-pane[hidden] { display: none; }
.card { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
.card h3 { margin: 0 0 4px; font-size: 14px; }
.card h4 { margin: 10px 0 2px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; }
.card h4.section { color: var(--text); }
.card p, .card ul, .card ol { margin: 4px 0; }
.card ul, .card ol { padding-left: 18px; }
.card .lead { font-size: 13.5px; }
.card .brief { font-family: ui-monospace, monospace; font-size: 12px; color: var(--muted); }
ul.recipe { list-style: none; padding-left: 0; }
ul.recipe li { display: flex; justify-content: space-between; gap: 8px; }
button.link { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-align: left; }
.strength { display: flex; align-items: center; gap: 8px; margin: 8px 0 2px; }
.strength input { flex: 1; }
.tune-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 6px; }
.scope-chip { padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.tune-pane { --tp-base-background-color: var(--panel-2); --tp-container-background-color: #38383c; --tp-label-foreground-color: #b9b9be; }
.tune-pane .tp-lblv { position: relative; }
.tune-pane .tp-lblv_l { cursor: help; }
.mod-dot { display: none; position: absolute; left: 1px; top: 50%; width: 7px; height: 7px; padding: 0; margin-top: -3px; border-radius: 50%; border: 0; background: var(--accent); z-index: 1; }
.modified > .mod-dot { display: block; }

.viewport { position: relative; min-height: 0; overflow: hidden; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#fatal { position: absolute; inset: 24px; padding: 16px; background: var(--panel); border: 1px solid var(--bad); border-radius: 8px; color: var(--bad); }
.plain-badge { position: absolute; top: 12px; left: 12px; padding: 2px 10px; border-radius: 6px; background: rgb(0 0 0 / 0.65); color: #fff; font-weight: 700; letter-spacing: 1.5px; pointer-events: none; }
.split-handle { position: absolute; top: 0; bottom: 0; width: 28px; margin-left: -14px; cursor: ew-resize; touch-action: none; display: flex; justify-content: center; align-items: flex-start; }
.split-handle[hidden] { display: none; }
.split-handle span { position: absolute; top: 12px; padding: 1px 6px; font-size: 11px; font-weight: 700; letter-spacing: 1px; color: #fff; background: rgb(0 0 0 / 0.6); border-radius: 4px; pointer-events: none; }
.split-handle span:first-child { right: 22px; }
.split-handle span:last-child { left: 22px; }
.split-handle::after { content: ''; position: absolute; top: 50%; width: 22px; height: 22px; margin-top: -11px; border-radius: 50%; background: #fff; box-shadow: 0 1px 6px rgb(0 0 0 / 0.5); }
.coach, .toast { position: absolute; left: 50%; transform: translateX(-50%); padding: 8px 14px; border-radius: 8px; background: rgb(20 20 22 / 0.88); border: 1px solid var(--line); max-width: min(520px, 90%); }
.coach { bottom: 16px; display: flex; gap: 10px; align-items: center; }
.coach[hidden], .toast[hidden] { display: none; }
.toast { top: 12px; }

.statusbar { display: flex; align-items: center; gap: 12px; padding: 5px 12px; background: var(--panel); border-top: 1px solid var(--line); color: var(--muted); white-space: nowrap; min-width: 0; }
.statusbar .compare { display: flex; gap: 6px; }
.statusbar .status { margin-left: auto; overflow: hidden; text-overflow: ellipsis; }
.rebuild-chip { color: var(--warn); overflow: hidden; text-overflow: ellipsis; }
#app.ui-hidden .topbar, #app.ui-hidden .looks, #app.ui-hidden .inspector, #app.ui-hidden .statusbar { display: none; }
#app.ui-hidden .workspace { grid-template-columns: 1fr; }
table.ratings { border-collapse: collapse; margin: 6px 0; width: 100%; }
table.ratings td, table.ratings th { padding: 2px 4px; text-align: left; font-weight: 500; }
table.ratings input { width: 100%; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 2px 4px; }
details.earlier { margin-top: 14px; }
.scene-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.scene-card { display: flex; flex-direction: column; align-items: flex-start; text-align: left; gap: 1px; padding: 6px 8px; }
.scene-card.on { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
table.readouts { width: 100%; border-collapse: collapse; }
table.readouts td { padding: 1px 4px; }
table.readouts td:nth-child(odd) { color: var(--muted); }
.pick { border: 1px dashed var(--accent); border-radius: 6px; padding: 6px 8px; margin-top: 6px; }
.modal { position: fixed; inset: 0; background: rgb(0 0 0 / 0.6); display: flex; align-items: center; justify-content: center; z-index: 20; padding: 16px; }
.modal[hidden] { display: none; }
.modal-box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; max-width: 100%; max-height: 100%; overflow: auto; }
.modal-box header { display: flex; gap: 12px; align-items: center; margin-bottom: 8px; }
.modal-box header button { margin-left: auto; }
.modal-box header a { color: var(--accent); }
.modal-box img { display: block; max-width: 100%; height: auto; }
details.earlier > summary { cursor: pointer; color: var(--muted); }

.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; z-index: 10; box-shadow: -8px 0 24px rgb(0 0 0 / 0.35); }
.drawer[hidden] { display: none; }
.drawer header { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.drawer header .close { margin-left: auto; }
.drawer nav { display: flex; gap: 4px; padding: 8px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.drawer nav button.on { border-color: var(--accent); color: var(--accent); }
.drawer .count { color: var(--bad); }
.drawer .body { overflow: auto; padding: 12px 16px 24px; }
.hint { color: var(--muted); }
.row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 6px 0; }

.check { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; margin: 10px 0; background: var(--panel-2); }
.check h4 { margin: 2px 0 4px; font-size: 13px; }
.check ol { margin: 4px 0; padding-left: 20px; }
.check .expected { margin: 4px 0; color: var(--muted); }
.cid { color: var(--muted); font-weight: 500; margin-right: 4px; }
.check textarea, textarea.report { width: 100%; min-height: 44px; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px; font: inherit; }
textarea.report { min-height: 340px; font: 12px/1.4 ui-monospace, monospace; }
button.status.on.pass { border-color: var(--ok); color: var(--ok); }
button.status.on.fail { border-color: var(--bad); color: var(--bad); }
button.status.on.unsure { border-color: var(--warn); color: var(--warn); }

.spike { border: 1px solid var(--line); border-radius: 8px; margin: 8px 0; padding: 6px 10px; background: var(--panel-2); }
.spike summary { cursor: pointer; }
.spike table { width: 100%; border-collapse: collapse; margin: 6px 0; }
.spike td { padding: 2px 4px; border-top: 1px solid var(--line); vertical-align: top; }
.spike tr.bad td { color: var(--bad); }
.spike tr.info td { color: var(--muted); }
.chip { display: inline-block; min-width: 76px; text-align: center; padding: 0 6px; border-radius: 999px; border: 1px solid currentColor; font-size: 11px; }
.chip.go { color: var(--ok); }
.chip.go-fallback { color: var(--warn); }
.chip.no-go, .chip.error { color: var(--bad); }
.ms { color: var(--muted); float: right; }
pre.err, pre.warn { white-space: pre-wrap; word-break: break-word; padding: 6px 8px; border-radius: 6px; background: var(--bg); margin: 4px 0; }
pre.err { color: var(--bad); }
pre.warn { color: var(--warn); }
table.env td { padding: 2px 6px; vertical-align: top; border-bottom: 1px solid var(--line); }
table.env td:first-child { color: var(--muted); white-space: nowrap; }
table.env code { word-break: break-all; }

/* Narrow screens (§5.1): looks become a strip under the view, the inspector a toggled sheet. */
@media (max-width: 900px) {
	.build, .field.tier #tier-label { display: none; }
	.topbar { padding: 6px 10px; gap: 6px; flex-wrap: wrap; }
	.narrow-only { display: inline-block; }
	.workspace { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) auto; }
	.looks { grid-row: 2; flex-direction: row; overflow-x: auto; border-right: 0; border-top: 1px solid var(--line); padding: 6px; }
	.looks h3, .looks .hint { display: none; }
	.look-card { min-width: 150px; }
	.inspector { display: none; position: fixed; left: 0; right: 0; bottom: 0; height: 55%; z-index: 5; border-left: 0; border-top: 1px solid var(--line); }
	#app.inspector-open .inspector { display: flex; }
	.statusbar { flex-wrap: wrap; }
	.statusbar .compare { order: -1; width: 100%; justify-content: center; }
}

import * as THREE12 from "three/webgpu";
import { pass as pass5, posterize as posterize2 } from "three/tsl";
import { gaussianBlur } from "three/addons/tsl/display/GaussianBlurNode.js";
import { bloom as bloom2 } from "three/addons/tsl/display/BloomNode.js";
var s5_rebuild_default = {
  id: 5,
  key: "rebuild",
  title: "Structural rebuild: outputNode swap + needsUpdate, leak check",
  iterations: 200,
  async run({ renderer, R, options = {} }) {
    const iterations = options.rebuildIterations || this.iterations;
    const scene = new THREE12.Scene();
    scene.add(new THREE12.HemisphereLight(16777215, 3355443, 2));
    scene.add(new THREE12.Mesh(new THREE12.TorusKnotGeometry(0.5, 0.18, 96, 16), new THREE12.MeshStandardNodeMaterial({ color: 16746564, emissive: 3346688 })));
    const camera = frontCamera(1.1);
    const scenePass = pass5(scene, camera);
    const post = new THREE12.PostProcessing(renderer);
    const target = new THREE12.RenderTarget(SIZE, SIZE);
    const variants = [
      () => ({ node: scenePass, owned: [] }),
      () => ({ node: posterize2(scenePass, 6), owned: [] }),
      () => {
        const b = gaussianBlur(scenePass, 1, 2);
        return { node: b, owned: [b] };
      },
      () => {
        const b = bloom2(scenePass, 1, 0.5, 0.2);
        return { node: scenePass.add(b), owned: [b] };
      }
    ];
    let current = null;
    const apply = (i) => {
      const next = variants[i % variants.length]();
      post.outputNode = next.node;
      post.needsUpdate = true;
      renderer.setRenderTarget(target);
      post.render();
      renderer.setRenderTarget(null);
      if (current) for (const n of current.owned) n.dispose();
      current = next;
    };
    const memory = () => ({ textures: renderer.info.memory.textures, geometries: renderer.info.memory.geometries });
    let warm = null;
    const t0 = performance.now();
    for (let i = 0; i < iterations; i++) {
      apply(i);
      if (i === variants.length * 2 - 1) warm = memory();
      if (i % 25 === 0) {
        if (timestampsSupported(renderer)) await renderer.resolveTimestampsAsync("render");
        await new Promise((r) => setTimeout(r, 0));
      }
    }
    const ms = (performance.now() - t0) / iterations;
    const end = memory();
    R.check(`GPU textures stable over ${iterations} rebuilds`, end.textures - warm.textures <= 2, [warm.textures, end.textures], "growth ≤ 2");
    R.check("geometries stable", end.geometries - warm.geometries <= 1, [warm.geometries, end.geometries], "growth ≤ 1");
    R.info("average ms per rebuild + render", ms, "compiles are cached after the first cycle");
    const stats = async (i) => {
      post.outputNode = variants[i]().node;
      post.needsUpdate = true;
      return pixelStats(await renderToPixels(renderer, SIZE, SIZE, () => post.render()));
    };
    const plain2 = await stats(0), poster = await stats(1);
    R.check("swapped graph changes the image", Math.abs(plain2.lumaStd - poster.lumaStd) > 2e-3 || Math.abs(plain2.meanLuma - poster.meanLuma) > 2e-3, [plain2.meanLuma, poster.meanLuma], "differs");
    if (current) for (const n of current.owned) n.dispose();
    scenePass.dispose();
    post.dispose();
    target.dispose();
    disposeScene(scene);
  }
};

import * as THREE13 from "three/webgpu";
import * as TSL2 from "three/tsl";
var PIXELS = 3;
function traceOutline(px) {
  let cx = 0, cy = 0, n = 0;
  const isRed = (p10) => p10[0] > 180 && p10[1] < 80 && p10[2] < 80;
  for (let y = 0; y < px.height; y++) for (let x = 0; x < px.width; x++) if (isRed(px.at(x, y))) {
    cx += x;
    cy += y;
    n++;
  }
  cx /= n;
  cy /= n;
  let gaps = 0, widthSum = 0, covered = 0;
  for (let a = 0; a < 360; a++) {
    const dx = Math.cos(a * Math.PI / 180), dy = Math.sin(a * Math.PI / 180);
    let t = 0;
    while (t < px.width && isRed(px.at(cx + dx * t, cy + dy * t))) t += 0.5;
    const first = px.at(cx + dx * (t + 0.5), cy + dy * (t + 0.5));
    if (luma(first) > 0.6) {
      gaps++;
      continue;
    }
    let w = 0;
    while (w < 20 && luma(px.at(cx + dx * (t + w), cy + dy * (t + w))) < 0.4) w += 0.5;
    widthSum += w;
    covered++;
  }
  return { gapShare: gaps / 360, width: covered ? widthSum / covered : 0, objectPixels: n };
}
