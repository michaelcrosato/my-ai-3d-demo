<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Style Lab</title>
	<link rel="stylesheet" href="./src/app/styles.css">
	<script type="importmap">
	{
		"imports": {
			"three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.webgpu.js",
			"three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.webgpu.js",
			"three/tsl": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.tsl.js",
			"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.182.0/examples/jsm/",
			"@dimforge/rapier3d-compat": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.19.3/rapier.mjs",
			"tweakpane": "https://cdn.jsdelivr.net/npm/tweakpane@4.0.5/dist/tweakpane.min.js",
			"@tweakpane/plugin-essentials": "https://cdn.jsdelivr.net/npm/@tweakpane/plugin-essentials@0.2.1/dist/tweakpane-plugin-essentials.min.js",
			"uqr": "https://cdn.jsdelivr.net/npm/uqr@0.1.3/dist/index.mjs"
		}
	}
	</script>
</head>
<body>
	<div id="app">
		<header class="topbar">
			<span class="brand">Style Lab</span>
			<label class="field">Scene <select id="scene-select"></select></label>
			<label class="field tier" title="Model complexity: the same layout and colors, more geometric detail (- / =)">Complexity <input id="tier-range" type="range" min="0" max="3" step="1" value="0"> <span id="tier-label">Blockout</span></label>
			<label class="field">Shot <select id="shot-select"></select></label>
			<button id="turntable-btn" type="button" title="Turntable (T)">⟳ Turntable</button>
			<span class="spacer"></span>
			<span id="backend-badge" class="badge">starting…</span>
			<span id="build" class="build"></span>
			<button id="inspector-btn" type="button" class="narrow-only">⚙ Inspector</button>
			<button id="audit-btn" type="button" title="Rank this look's effects by GPU cost; what runs on phones (P)">⚡ Audit</button>
			<button id="brief-btn" type="button" title="The agent brief and the export files (B)">📝 Brief</button>
			<button id="verify-btn" type="button" title="The guided tour and the checks I need your report on">🧪 Verify</button>
			<button id="help-btn" type="button" title="Keyboard and gamepad map (?)" aria-label="Help">?</button>
		</header>
		<div class="workspace">
			<aside id="looks" class="looks"></aside>
			<main id="viewport" class="viewport">
				<canvas id="view"></canvas>
				<div id="plain-badge" class="plain-badge" hidden>PLAIN</div>
				<div id="split-handle" class="split-handle" hidden><span>PLAIN</span><span>STYLED</span></div>
				<div id="coach" class="coach" hidden></div>
				<div id="toast" class="toast" hidden></div>
				<div id="fatal" hidden></div>
			</main>
			<aside id="inspector" class="inspector"></aside>
		</div>
		<footer class="statusbar">
			<div class="compare">
				<button id="hold-btn" type="button" title="Hold to see the plain baseline (Space, gamepad X)">Hold to compare <kbd>Space</kbd></button>
				<button id="split-btn" type="button" title="Split wipe: plain left, styled right (C, gamepad LT)">Split <kbd>C</kbd></button>
				<button id="flicker-btn" type="button" title="Alternate every 0.5 s (F)">Flicker <kbd>F</kbd></button>
			</div>
			<span id="rebuild-chip" class="rebuild-chip"></span>
			<span id="status" class="status">Starting…</span>
		</footer>
	</div>
	<aside id="verify" class="drawer" hidden></aside>
	<div id="modal" class="modal" hidden></div>
	<script type="module" src="./src/app/main.js"></script>
</body>
</html>
